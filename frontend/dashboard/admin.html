<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Hostel Care</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark hc-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Hostel Care 🏨</a>
      <div class="d-flex align-items-center">
        <span id="nav-role" class="text-white me-3 small"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="page-container fade-in">

    <!-- CREATE WARDEN -->
    <div class="card hc-card mb-4">
      <div class="card-header">
        <h5 class="mb-0">Create Warden</h5>
      </div>
      <div class="card-body">
        <form id="createWardenForm" class="row g-3">
          <div class="col-md-4">
            <input type="text" class="form-control" id="wardenName" placeholder="Full Name" required>
          </div>
          <div class="col-md-4">
            <input type="email" class="form-control" id="wardenEmail" placeholder="Email" required>
          </div>
          <div class="col-md-4">
            <input type="password" class="form-control" id="wardenPassword" placeholder="Password" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Create Warden</button>
            <span id="wardenMsg" class="ms-3 small"></span>
          </div>
        </form>
      </div>
    </div>

    <!-- COMPLAINTS -->
    <div class="card hc-card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Complaints (Admin View)</h5>
        <div class="d-flex align-items-center gap-2">
          <label for="adminStatusFilter" class="me-1 small text-muted mb-0">Filter:</label>
          <select id="adminStatusFilter" class="form-select form-select-sm" style="width:160px">
            <option value="">All</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="resolved">Resolved</option>
          </select>
        </div>
      </div>
      <div class="card-body">
        <p class="small text-muted mb-1">
          Admin can view all complaints across students and hostels.
        </p>
        <p class="small mb-0" id="adminSummary"></p>
      </div>
    </div>

    <div class="card hc-card mb-5">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle" id="adminComplaintsTable">
            <thead>
              <tr>
                <th>Student</th>
                <th>Title</th>
                <th>Category</th>
                <th>Status</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <p id="adminTableMsg" class="mt-2 small"></p>
        <div id="adminPagination"></div>
      </div>
    </div>

    <!-- MESS FEEDBACK -->
    <div class="card hc-card">
      <div class="card-header">
        <h5 class="mb-0">Mess Quality Feedback (Admin Only)</h5>
      </div>
      <div class="card-body">
        <p class="small text-muted mb-3">
          Internal feedback regarding mess food quality and hygiene.
        </p>

        <div class="table-responsive">
          <table class="table align-middle" id="adminFeedbackTable">
            <thead>
              <tr>
                <th>Student</th>
                <th>Rating</th>
                <th>Feedback</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <p id="adminFeedbackMsg" class="mt-2 small"></p>
        <div id="adminFeedbackPagination"></div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  

</body>
</html>
