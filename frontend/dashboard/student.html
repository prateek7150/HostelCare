<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Hostel Care</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark hc-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Hostel Care 🏨</a>
      <div class="d-flex align-items-center">
        <span id="nav-role" class="text-white me-3 small"></span>
        <button class="btn btn-sm btn-outline-light" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="page-container fade-in">

    <!-- Complaint Form -->
    <div class="card hc-card mb-4">
      <div class="card-header">
        <h5 class="mb-0">Submit Complaint</h5>
      </div>
      <div class="card-body">
        <form id="complaintForm">
          <div class="mb-3">
            <input
              type="text"
              id="title"
              class="form-control"
              placeholder="Complaint Title"
              required
            >
          </div>
          <div class="mb-3">
            <textarea
              id="description"
              class="form-control"
              placeholder="Complaint Description"
              required
            ></textarea>
          </div>
          <div class="mb-3">
            <select id="category" class="form-select">
              <option value="electricity">Electricity</option>
              <option value="water">Water</option>
              <option value="cleanliness">Cleanliness</option>
              <option value="food">Food</option>
              <option value="other">Other</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">
            Submit Complaint
          </button>
        </form>
      </div>
    </div>

    <!-- Complaints List -->
    <div class="card hc-card mb-4">
      <div class="card-header">
        <h5 class="mb-0">My Complaints</h5>
      </div>
      <div class="card-body">
        <div class="table-responsive">
          <table class="table" id="complaintsTable">
            <thead>
              <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Category</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Complaints will be injected via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Mess Feedback Form -->
    <div class="card hc-card">
      <div class="card-header">
        <h5 class="mb-0">Mess Feedback</h5>
      </div>
      <div class="card-body">
        <form id="feedbackForm">
          <div class="mb-3">
            <input
              type="text"
              id="roomNumber"
              class="form-control"
              placeholder="Room Number"
              required
            >
          </div>
          <div class="mb-3">
            <select id="rating" class="form-select" required>
              <option value="">Rating</option>
              <option value="1">1 - Poor</option>
              <option value="2">2</option>
              <option value="3">3 - Average</option>
              <option value="4">4</option>
              <option value="5">5 - Excellent</option>
            </select>
          </div>
          <div class="mb-3">
            <textarea
              id="comment"
              class="form-control"
              placeholder="Your feedback..."
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-success">
            Submit Feedback
          </button>
        </form>
        <p id="feedbackMsg" class="mt-2 small"></p>

      </div>
    </div>

  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>


</body>
</html>
