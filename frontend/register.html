<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Care Registration</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card login-card p-4 fade-in">
    <h3 class="text-center mb-1">Hostel Care🏨</h3>
    <p class="text-center text-muted mb-4" style="font-size: 0.9rem;">
      Create an account
    </p>

    <form id="registerForm">
      <div class="mb-3">
        <input
          type="text"
          id="name"
          class="form-control"
          placeholder="Full Name"
          required
        >
      </div>

      <div class="mb-3">
        <input
          type="email"
          id="email"
          class="form-control"
          placeholder="Email"
          required
        >
      </div>

      <div class="mb-3">
        <input
          type="password"
          id="password"
          class="form-control"
          placeholder="Password"
          required
        >
      </div>
      <div class="mb-3">
  <input type="text" id="roomNumber" class="form-control" placeholder="Room Number">
</div>


      <!-- <div class="mb-3">
        <select id="role" class="form-select" required>
          <option value="student">Student</option>
          <option value="warden">Warden</option>
          <option value="admin">Admin</option>
        </select>
      </div> -->

      <button type="submit" class="btn btn-success w-100">
        Register
      </button>
    </form>

    <p id="registerMsg" class="mt-2 small"></p>

    <div class="text-center mt-3">
      <a href="index.html" class="small">Already registered? Login here</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
  
</body>
</html>
